[project]
name = "nanounet"
version = "0.1.0"
description = "CT lesion research monorepo: nanounet (promptable seg), lesionglue (lesion matching), and their pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1.2",
    "pytorch-lightning>=2.2.0",
    "wandb>=0.16.0",
    "dynamic-network-architectures>=0.4.1,<0.5",
    "batchgenerators>=0.25",
    "batchgeneratorsv2>=0.3.0",
    "acvl-utils>=0.2.3,<0.3",
    "numpy>=1.24",
    "scipy",
    "scikit-image>=0.19.3",
    "connected-components-3d>=3.12",
    "SimpleITK>=2.2.1",
    "blosc2>=3.0.0b1",
    "scikit-learn",
    "rich>=13.0",
]

[project.optional-dependencies]
lesionglue = [
    "torch-geometric>=2.5",
    "pandas>=2.0",
    "nibabel>=5.0",
    "torchmetrics>=1.3",
    "dash>=2.18",
    "dash-cytoscape>=1.0",
]

[project.scripts]
nanounet_preprocess = "nanounet.cli.preprocess:main"
nanounet_train = "nanounet.cli.train:main"
nanounet_pretrain = "nanounet.cli.pretrain:main"
nanounet_predict = "nanounet.cli.predict:main"
nanounet_lesion_weights = "nanounet.cli.lesion_weights:main"
nanounet_build_splits = "nanounet.cli.build_splits:main"
nanounet_build_valset = "nanounet.cli.build_valset:main"
segtrack_run = "segtrack.cli.run:main"
lesionglue_track = "lesionglue.cli.track:main"
lesionglue_split = "lesionglue.cli.split:main"
lesionglue_preprocess = "lesionglue.cli.preprocess:main"
lesionglue_train = "lesionglue.cli.train:main"
lesionglue_eval = "lesionglue.cli.eval:main"
lesionglue_predict = "lesionglue.cli.predict:main"
lesionglue_report = "lesionglue.cli.report:main"
lesionglue_cv = "lesionglue.cli.cv:main"
lesionglue_oof = "lesionglue.cli.oof:main"
lesionglue_pool = "lesionglue.cli.pool:main"
lesionglue_audit = "lesionglue.cli.audit:main"
lesionglue_qc = "lesionglue.cli.qc:main"
lesionglue_baseline_distance = "lesionglue.cli.baseline_distance:main"

[build-system]
requires = ["setuptools>=67.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "nanounet*", "lesionglue*", "segtrack*", "experiments*"]
